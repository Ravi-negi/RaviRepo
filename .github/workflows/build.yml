name: Build and Deploy to IIS (VM)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted   # 👈 IMPORTANT (your VM runners)

    steps:
    # -----------------------
    # Checkout Code
    # -----------------------
    - name: Checkout code
      uses: actions/checkout@v4

    # -----------------------
    # Setup .NET
    # -----------------------
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # -----------------------
    # Build Backend
    # -----------------------
    - name: Restore .NET
      run: dotnet restore ./DemoApi

    - name: Build .NET
      run: dotnet build ./DemoApi --configuration Release

    - name: Publish .NET
      run: dotnet publish ./DemoApi -c Release -o publish

    # -----------------------
    # Setup Node
    # -----------------------
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # -----------------------
    # Build React App
    # -----------------------
    - name: Install dependencies
      run: |
        cd demo-ui
        npm install

    - name: Build React app
      run: |
        cd demo-ui
        npm run build

    # -----------------------
    # Copy React build into .NET
    # -----------------------
    - name: Copy frontend to backend
      run: |
        mkdir publish\wwwroot
        xcopy demo-ui\build\* publish\wwwroot\ /E /I /Y

    # -----------------------
    # Deploy to IIS
    # -----------------------
    - name: Deploy to IIS
      run: |
        powershell -Command "
        Import-Module WebAdministration;

        if (Get-Website 'MyApp' -ErrorAction SilentlyContinue) {
            Stop-Website 'MyApp'
        }

        if (Test-Path 'C:\inetpub\myapp') {
            Remove-Item 'C:\inetpub\myapp\*' -Recurse -Force
        } else {
            New-Item -ItemType Directory -Path 'C:\inetpub\myapp'
        }

        Copy-Item -Recurse publish\* 'C:\inetpub\myapp\'

        if (Get-Website 'MyApp' -ErrorAction SilentlyContinue) {
            Start-Website 'MyApp'
        }
        "